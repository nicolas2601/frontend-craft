<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mancha</title>
  <style>
    @font-face { font-family: 'Fixture Serif'; src: local('DejaVu Serif'), local('DejaVuSerif'), local('Liberation Serif'); }
    body { margin: 0; background: #f5efe6; color: #2b2420; font-family: 'Fixture Serif', serif; }
    h1 { font-size: 72px; font-weight: 400; margin: 80px 40px 20px; }
    h1 em { color: #c2603f; font-style: italic; }
    .label { font-family: monospace; text-transform: uppercase; letter-spacing: 0.2em; font-size: 12px; color: #c2603f; }
    .wide { width: 1600px; height: 20px; }
    .row { display: flex; gap: 24px; padding: 40px; }
    .card { width: 300px; height: 200px; border-radius: 16px; background: #fff; padding: 20px; transition: all .3s ease-in; }
    .faint { color: #cfc6ba; }
    .btn { background: #c2603f; color: #fff; padding: 12px 20px; border-radius: 8px; text-decoration: none; }
    .hero { height: 100vh; }
  </style>
</head>
<body>
  <section class="hero">
    <p class="label">Café de especialidad</p>
    <h1>Café que se <em>siente</em> en cada taza</h1>
    <p class="faint">Lorem ipsum dolor sit amet, elevate your mornings with a seamless, cutting-edge experience ☕✨</p>
    <a class="btn" href="#">Get Started</a>
    <div class="wide"></div>
  </section>
  <p class="label">Nuestro origen</p>
  <h2>Origen</h2>
  <p class="label">El proceso</p>
  <h2>Proceso</h2>
  <p class="label">Visítanos</p>
  <h2>Visítanos</h2>
  <div class="row">
    <div class="card"><h3>Uno</h3></div>
    <div class="card"><h3>Dos</h3></div>
    <div class="card"><h3>Tres</h3></div>
  </div>
  <img src="missing-photo.jpg">
</body>
</html>
